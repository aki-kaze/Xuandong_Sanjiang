server.port=8080
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:xundong_sanjiang}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=org.example.sanjiang.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
pagehelper.helper-dialect=mysql
pagehelper.reasonable=true
pagehelper.support-methods-arguments=true
logging.level.org.example.sanjiang.mapper=info
logging.level.root=info

# 千问AI API配置
qwen.api.key=${QWEN_API_KEY:}
qwen.api.url=https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
qwen.api.model=qwen-plus

# Redis缓存配置
spring.redis.host=127.0.0.1
spring.redis.port=6379
spring.redis.database=0
spring.redis.password=${REDIS_PASSWORD:}
spring.cache.type=redis
spring.cache.cache-names=navConfigs,sensitiveWords
spring.cache.redis.time-to-live=3600000

# 微信支付配置
wechat.pay.app-id=${WECHAT_PAY_APP_ID:}
wechat.pay.mch-id=${WECHAT_PAY_MCH_ID:}
wechat.pay.api-key=${WECHAT_PAY_API_KEY:}
wechat.pay.notify-url=https://your-domain.com/api/orders/wechat/callback

# 文件上传配置
file.upload.base-url=http://localhost:8080
